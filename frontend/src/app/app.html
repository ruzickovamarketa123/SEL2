<div style="display: flex; flex-direction: column; height: 100vh; overflow: hidden; background-color: #f5f5f5;">

  <div style="display: flex; align-items: center; padding: 12px 16px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 10;">

    @if(authService.isLoggedIn()) {
    <div style="flex: 0 0 66%;">
      <search-input (searchChanged)="currentSearch = $event"></search-input>
    </div>
    }

    <div style="flex: 1; display: flex; justify-content: center; gap: 8px;">
      @if (authService.isLoggedIn()) {
        <app-import-export
          #importExportBtn
              (exportClicked)="onExport()"
              (importClicked)="onImport(importExportBtn)">
        </app-import-export>
        <app-profile></app-profile>
        <button (click)="authService.logout(); clearData()" style="
          padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 500;
          cursor: pointer; background: rgb(236, 86, 164, 0.8); color: #000000; border: 1.5px solid #000000;
        ">logout</button>
      } @else {
        <app-login></app-login>
        <app-register></app-register>
      }
    </div>

  </div>

  <div style="display: flex; flex: 1; overflow: hidden;">

    @if(authService.isLoggedIn()) {
    <div style="width: 380px; background: white; border-right: 1px solid #ddd; flex-shrink: 0; overflow-y: auto; padding: 0;">
      <list
        [tours]="enrichedTours()"
        [searchTerm]="currentSearch"
        [selectedTourId]="selectedTourId()"
        [activeTab]="activeTab()"
        [allLogs]="tourLogs()"
        [selectedLog]="selectedLog() ?? undefined"
        [orsApiKey]="ORS_API_KEY"
        (tourSelected)="selectTour($event)"
        (tourAdded)="onTourAdded($event)"
        (activeTabChange)="activeTab.set($event)"
        (tourEdited)="onEditTour($event)"
        (tourDeleted)="onDeleteTour($event)"
        (logSelected)="selectedLog.set($event)"
        (logAdded)="onLogAdded($event)"
        (logEdited)="onEditLog($event)"
        (logDeleted)="onDeleteLog($event)"
        (tourClosed)="selectedTourId.set(null)">
      </list>
    </div>
    }

    <!-- right side: always just the map -->
    <div style="flex: 1; display: flex; gap: 12px; padding: 16px; overflow: hidden; min-width: 0;">

      @if (!authService.isLoggedIn()) {
      <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
        <div style="flex: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.12); isolation: isolate;"></div>
        <div style="background: white; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); color: #aaa; text-align: center; flex-shrink: 0;">
          <p style="margin: 0; font-size: 14px;">LOG IN OR REGISTER TO START PLANNING YOUR TOURS</p>
        </div>
      </div>
      }

      @else if (!selectedTour()) {
      <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
        <div style="flex: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.12); isolation: isolate;">
          <app-map [tour]="null" [apiKey]="ORS_API_KEY"></app-map>
        </div>
        <div style="background: white; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); color: #aaa; text-align: center; flex-shrink: 0;">
          <p style="margin: 0; font-size: 14px;">SELECT A TOUR FROM THE LIST TO SEE DETAILS HERE</p>
        </div>
      </div>
      }

      @else {
      <div style="flex: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.12); isolation: isolate; min-width: 0;">
        <app-map [tour]="selectedTour()" [apiKey]="ORS_API_KEY"></app-map>
      </div>
      }

    </div>
  </div>
</div>
